<title>Bé Vào Lớp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#FCFCFF; --card:#FFFFFF; --ink:#2A2250; --muted:#6C668C;
  --tim:#4B2FA8; --tim-2:#6B4FD8; --do:#E23D3D; --nang:#FFC23D; --la:#1E9E68; --troi:#2B8FE0;
  --li:#E4DFF7; --li-bold:#C9C0EF; --lp:#F0EDFA; --lpb:#E4DFF6; --margin:#F4AFAF;
  --display:"Baloo 2","Andika",ui-rounded,system-ui,sans-serif;
  --letter:"Andika","Baloo 2",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --maxw:760px; --sceneH:25vh; --chH:clamp(62px,10.5vh,112px); --gap:12px;
  --fs-q:clamp(18px,2.5vh,23px); --fs-ch:clamp(40px,7vh,64px); --btn:48px;
}
@media (max-height:720px){:root{--sceneH:20vh;--chH:clamp(54px,10vh,86px);--gap:9px;--fs-ch:clamp(36px,6.5vh,52px)}}
@media (max-height:560px){:root{--sceneH:26vh;--chH:clamp(44px,13vh,70px);--btn:40px;--gap:7px;--fs-q:17px;--fs-ch:clamp(30px,9vh,46px)}
  .cat{display:none} .prompt{padding:4px 10px 4px 4px} .speak{width:40px;height:40px}
  .picq .emo{font-size:15vh} .blankword{font-size:24px} .bigletter{font-size:20vh;padding:2px 20px 6px} .expr{font-size:11vh} .grp span{font-size:20px}
  .bigspeak{width:64px;height:64px} .seq span{min-width:44px;font-size:26px} .sp-pic{font-size:13vh} .slot{min-height:50px;min-width:46px} .slot b{font-size:26px;min-height:28px}
  .bar{padding-block:4px 4px}}
@media (min-width:760px){:root{--maxw:1000px;--fs-q:clamp(20px,2.4vh,26px)}}
@media (min-width:1200px){:root{--maxw:1260px}}
/* Laptop, PC, iPad ngang: phần chơi to hơn, dùng hết chiều ngang */
@media (min-aspect-ratio:5/4) and (min-width:1000px) and (min-height:640px){:root{--sceneH:31vh;--chH:clamp(78px,14vh,150px);--fs-ch:clamp(48px,8vh,90px);--fs-q:clamp(21px,2.8vh,30px);--gap:14px}
  .play{max-width:1200px!important}
}
@media (min-width:760px) and (min-height:900px){:root{--chH:clamp(90px,10vh,130px);--fs-ch:clamp(56px,6vh,76px)} .play{max-width:720px!important}}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--letter); font-size:17px; line-height:1.4;
  background:
    linear-gradient(to right, transparent 8px, var(--margin) 8px, var(--margin) 10px, transparent 10px) no-repeat,
    linear-gradient(to right, var(--lpb) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(to bottom, var(--lpb) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(to bottom, var(--lp) 1px, transparent 1px) 0 0/32px 8px,
    var(--paper);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid var(--troi);outline-offset:3px}

#app{display:flex;flex-direction:column;height:100%;max-width:var(--maxw);margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px 6px;flex:none}
.bar h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:800;font-size:clamp(19px,5vw,25px);line-height:1;color:var(--tim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:4px}
.iconbtn{width:var(--btn);height:var(--btn);flex:none;border:none;border-radius:15px;background:var(--card);color:var(--tim);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--li-bold),0 4px 0 var(--li-bold);transition:transform .08s,box-shadow .08s,background .9s linear}
.iconbtn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--li-bold),0 1px 0 var(--li-bold)}
.iconbtn svg{width:25px;height:25px}
.gear.hold{background:#FFD3D3}
.pill{display:flex;align-items:center;gap:4px;flex:none;background:var(--card);border-radius:999px;padding:4px 11px 4px 7px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.pill span{padding-top:3px}
.pill.star{box-shadow:inset 0 0 0 2px #F3D27E,0 4px 0 #F3D27E;color:#7E5300}
.pill.star svg{color:var(--nang)}
.pill.pow{box-shadow:inset 0 0 0 2px #B9A9F5,0 4px 0 #B9A9F5;color:var(--tim)}
.pill.pow svg{color:var(--tim-2)}
.pill.bump{animation:bump .45s}
@media (max-width:370px){.pill{font-size:17px;padding:4px 9px 4px 6px}.pill svg{width:19px;height:19px}.bar h1.sub{display:none}}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 20px;-webkit-overflow-scrolling:touch}

/* ---------- Map ---------- */
.mapbar{position:sticky;top:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding-block:2px 12px;background:linear-gradient(var(--paper) 82%,rgba(252,252,255,0));max-width:560px;margin:0 auto}
.ztabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.ztabs::-webkit-scrollbar{display:none}
.ztab{flex:none;border:none;border-radius:13px;background:var(--card);color:var(--muted);padding:6px 11px 4px;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;display:flex;align-items:center;gap:5px;box-shadow:inset 0 0 0 2px var(--li-bold)}
.ztab b{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--li);color:var(--tim);font-size:13px;padding-top:2px}
.ztab.on{background:var(--tim-2);color:#fff;box-shadow:none}
.ztab.on b{background:#fff}
.ztab.lock{opacity:.55}
.ztab svg{width:15px;height:15px}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px}
.actions .btn{min-width:0;padding-inline:8px;white-space:nowrap}
@media (max-width:400px){.actions{gap:6px}.actions .btn{font-size:16px;gap:4px}}
.map{position:relative;width:100%;max-width:460px;margin:0 auto}
.map>svg{display:block;width:100%;height:auto;aspect-ratio:360/1000}
.node{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;border:none;display:grid;place-items:center;padding:4px 0 0;font-family:var(--display);font-weight:800;font-size:25px;line-height:1;background:var(--card);color:var(--muted);box-shadow:inset 0 0 0 3px var(--li-bold),0 5px 0 var(--li-bold);z-index:2}
.node svg{width:24px;height:24px;margin-top:-4px}
.node.done{background:var(--la);color:#fff;box-shadow:inset 0 0 0 3px #14774D,0 5px 0 #14774D}
.node.cur{background:var(--nang);color:#3B2A00;box-shadow:inset 0 0 0 3px #D6940A,0 5px 0 #D6940A}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid rgba(255,194,61,.6);animation:ring 1.6s ease-out infinite}
.node.boss{width:66px;height:66px;font-size:14px}
.node.boss svg.skull{width:40px;height:40px;margin:0}
.node.lock{color:#A9A3C7}
.node.no{animation:shake .4s}
.node:active{transform:translate(-50%,calc(-50% + 3px))}
.nlabel{position:absolute;transform:translate(-50%,0);z-index:2;font-family:var(--display);font-weight:700;font-size:12px;line-height:1;color:var(--ink);background:rgba(255,255,255,.95);border-radius:8px;padding:4px 7px 2px;white-space:nowrap;box-shadow:0 0 0 1.5px var(--li-bold);pointer-events:none;display:flex;align-items:center;gap:2px}
.nlabel svg{width:13px;height:13px}
.nlabel .s-on{color:var(--nang)} .nlabel .s-off{color:#DDD8EE}
.nlabel.need{color:var(--tim);box-shadow:0 0 0 1.5px #B9A9F5}
/* Bản đồ: bảng hành trình bên trái khi màn hình rộng */
.mside{display:contents}
.mpanel{display:none}
.mzl{display:flex;flex-direction:column;gap:8px}
.mzrow{border:none;background:#FAF9FF;border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;box-shadow:inset 0 0 0 2px var(--li-bold)}
.mzrow.on{background:#F3F0FF;box-shadow:inset 0 0 0 3px var(--tim-2)}
.mzrow.lock{opacity:.6}
.mzn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--tim-2);color:#fff;font-family:var(--display);font-weight:800;flex:none;padding-top:2px}
.mzn svg{width:16px;height:16px}
.mzrow.lock .mzn{background:#C9C0EF}
.mzt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mzt b{font-family:var(--display);font-size:17px;line-height:1.1;color:var(--tim)}
.mzt small{font-size:13px;color:var(--muted)}
.mzm{height:7px;border-radius:4px;background:#E9E5F8;overflow:hidden}
.mzm span{display:block;height:100%;background:var(--la);border-radius:4px}
.mnext b{display:block;font-family:var(--display);font-size:18px;color:var(--tim)}
.mnext small{display:block;margin-top:4px;color:var(--muted);font-size:14px}
@media (min-width:1000px) and (min-aspect-ratio:6/5){
  .mapwrap{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,540px);gap:44px;justify-content:center;align-items:start}
  .mside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;padding-top:4px}
  .mside .mapbar{position:static;background:none;max-width:none;margin:0;padding:0}
  .mside .ztabs{display:none}
  .mpanel{display:flex;flex-direction:column;gap:14px}
  .mmain .map{max-width:none}
  .mside .welcome{margin:0}}
@media (min-width:700px) and (max-aspect-ratio:6/5){.map,.mapbar{max-width:620px}}
.mhero{position:absolute;z-index:3;width:42px;height:56px;transform:translate(-50%,-100%);transition:left 1.3s cubic-bezier(.4,.1,.3,1),top 1.3s cubic-bezier(.4,.1,.3,1);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(75,47,168,.18))}
.mhero.noanim{transition:none}
.mhero svg{width:100%;height:100%;display:block}
.mhero.walk svg{animation:walk .3s infinite alternate}
.warn{margin:0 auto 12px;max-width:560px;background:#FFF4D6;border-radius:14px;padding:10px 12px;color:#6B4A00;font-size:14px;box-shadow:inset 0 0 0 2px #F3D27E}

/* ---------- Play ---------- */
.play{display:flex;flex-direction:column;gap:var(--gap);max-width:600px;margin:0 auto;min-height:100%}
.scene{flex:none;border-radius:20px;overflow:hidden;border:3px solid var(--li-bold);background:#F4F9FF}
.scene svg{display:block;margin:0 auto;width:min(100%,calc(var(--sceneH) * 2.4));height:auto;aspect-ratio:360/150}
.gamebox{flex:1;display:flex;flex-direction:column;min-height:0}
.game{display:flex;flex-direction:column;gap:var(--gap);flex:1;min-height:0}
.side{display:flex;flex-direction:column;gap:var(--gap)}
.cat{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:3px 7px 1px;flex:none}
.cat.read{background:#FFE3E1;color:#B0302A}.cat.math{background:#DDF5EA;color:#14774D}.cat.write{background:#DCEBFB;color:#1B68A8}
@media (min-aspect-ratio:5/4) and (min-width:640px){
  .play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:22px;align-content:start;max-width:1100px;height:100%}
  .gamebox,.game{display:contents}
  .scene{grid-column:1;grid-row:1}
  .game>.prompt{grid-column:1;grid-row:2}
  .game>.stage,.game>.spbox{grid-column:1;grid-row:3;align-self:start}
  .game>.choices,.game>.side,.game .tview{grid-column:2;grid-row:1/4;align-self:center}
  .game .tview{align-self:stretch}
}
.scn .hero{transition:transform .7s cubic-bezier(.4,.1,.3,1)}
.scn .hero-in{transform-box:fill-box;transform-origin:50% 100%}
.scn .hero-in.hop{animation:hopk .55s}
.scn .it,.scn .mon,.scn .prin{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s,opacity .4s}
.scn .it.gone{transform:scale(0);opacity:0}
.scn .st{opacity:0;transform:translateY(12px)}
.scn .st.on{opacity:1;transform:none}
.scn .lk.gone{transform:translateY(46px) rotate(50deg);opacity:0}
.scn .bars{transition:transform .8s}
.scn .bars.open{transform:translateY(-86px)}
.scn .rn.on circle{fill:#FFD54F}
.scn .dpanel{transition:transform .8s,opacity .8s}
.scn .dpanel.open{transform:translateY(-14px);opacity:0}
.scn .hp{transition:color .3s}
.scn .hp.lost{color:#fff}
.scn .mon.hit{animation:hitk .4s}
.scn .mon.gone{transform:scale(0);opacity:0}
.scn .hpbar,.scn .cfill{transition:transform .5s}
.scn .hpbar{transform-box:fill-box;transform-origin:0 50%}
.scn .cage{transition:opacity .6s}
.scn .cage.open{opacity:0}
.scn .prin.free{animation:hopk .55s 3}
.scn .glow{opacity:0;transition:opacity .5s}
.scn .glow.on{opacity:1}
.shot{transition:transform .38s linear}
.puff-in{transform-box:fill-box;transform-origin:center;animation:puffk .6s forwards}

/* ---------- Questions ---------- */
.prompt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px 12px 8px 8px;box-shadow:inset 0 0 0 2px var(--li-bold)}
.prompt .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.speak{width:50px;height:50px;flex:none;border:none;border-radius:50%;background:var(--tim-2);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--tim)}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tim)}
.speak svg{width:27px;height:27px}
.q{margin:0;font-family:var(--display);font-weight:700;font-size:var(--fs-q);line-height:1.2;color:var(--ink);text-wrap:balance}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;min-height:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{border:none;border-radius:20px;background:var(--card);color:var(--tim);min-height:var(--chH);display:grid;place-items:center;padding:6px;box-shadow:inset 0 0 0 3px var(--li-bold),0 6px 0 var(--li-bold);transition:transform .08s,box-shadow .08s,background .2s,opacity .2s}
.choice:active{transform:translateY(4px);box-shadow:inset 0 0 0 3px var(--li-bold),0 2px 0 var(--li-bold)}
.choice.ok{background:var(--la);color:#fff;box-shadow:inset 0 0 0 3px #14774D,0 6px 0 #14774D;animation:pop .35s}
.choice.ok .tone small,.choice.ok .tmark{color:#fff}
.choice.no{animation:shake .4s}
.choice.tried{opacity:.38}
.game.bare .choice{min-height:calc(var(--chH) * 1.35)}
.ch{font-family:var(--letter);font-weight:700;font-size:var(--fs-ch);line-height:1}
.wd{font-family:var(--letter);font-weight:700;font-size:calc(var(--fs-ch) * .72);line-height:1}
.num{font-family:var(--display);font-weight:800;font-size:var(--fs-ch);line-height:1;padding-top:.12em}
.shp{width:70%;max-width:104px;max-height:calc(var(--chH) * 1.1);height:auto;display:block}
.bigspeak{width:clamp(76px,12vh,100px);height:clamp(76px,12vh,100px);border:none;border-radius:50%;background:var(--do);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 #B0302A;position:relative}
.bigspeak::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid rgba(226,61,61,.35);animation:ring 1.8s ease-out infinite}
.bigspeak svg{width:52%;height:52%}
.bigspeak:active{transform:translateY(5px);box-shadow:0 2px 0 #B0302A}
.picq{display:flex;flex-direction:column;align-items:center;gap:4px}
.emo{font-family:var(--emoji);line-height:1.1}
.picq .emo{font-size:clamp(60px,12vh,100px)}
.bigletter{font-family:var(--letter);font-weight:700;font-size:clamp(80px,15vh,140px);line-height:1;color:var(--tim);background:var(--card);border-radius:24px;padding:6px 28px 10px;box-shadow:inset 0 0 0 3px var(--li-bold)}
.blankword{font-family:var(--letter);font-weight:700;font-size:clamp(28px,5vh,38px);line-height:1;color:var(--ink)}
.blank{display:inline-block;width:.72em;height:.95em;border:3px dashed var(--do);border-radius:8px;vertical-align:-.12em;margin-right:3px}
.blankword mark{background:#FFE9A8;color:var(--do);border-radius:8px;padding:0 3px}
.tray{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--card);border-radius:18px;padding:8px;box-shadow:inset 0 0 0 3px var(--li-bold);max-width:min(100%,calc(var(--chH) * 5.4))}
.cell{aspect-ratio:1;border-radius:12px;border:2px dashed var(--li)}
.obj{aspect-ratio:1;border:none;border-radius:12px;background:#F5F3FE;padding:0;display:grid;place-items:center;position:relative;font-family:var(--emoji);font-size:clamp(22px,4.4vh,40px);line-height:1}
.obj.on{background:#FFF1C4;box-shadow:inset 0 0 0 3px var(--nang)}
.obj i{position:absolute;top:3px;right:5px;font-style:normal;font-family:var(--display);font-weight:800;font-size:13px;line-height:1;color:#8A5A00}
.minitray{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:150px;font-family:var(--emoji);font-size:clamp(20px,3.6vh,30px);line-height:1.15}
.game.bare .minitray{padding:8px 0}
.expr{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(38px,7vh,60px);line-height:1;color:var(--tim);font-variant-numeric:tabular-nums}
.expr span{padding-top:.1em}
.expr .op{color:var(--do)}
.expr .ans{min-width:1.15em;text-align:center;border:3px dashed var(--li-bold);border-radius:14px;padding:.08em .12em 0;color:var(--muted)}
.expr .ans.done{border-style:solid;border-color:var(--la);color:var(--la);animation:pop .35s}
.pics{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:170px;background:var(--card);border-radius:16px;padding:7px;box-shadow:inset 0 0 0 2px var(--li-bold)}
.grp span{font-family:var(--emoji);font-size:clamp(20px,3.4vh,26px);line-height:1.2;width:1.2em;text-align:center;position:relative}
.grp .gone{opacity:.35}
.grp .gone::after{content:"";position:absolute;left:8%;right:8%;top:48%;height:3px;border-radius:2px;background:var(--do);transform:rotate(-35deg)}
.plus{font-family:var(--display);font-weight:800;font-size:36px;color:var(--do)}
.seq{display:flex;gap:10px;justify-content:center}
.seq span{min-width:clamp(52px,9vh,72px);aspect-ratio:1;display:grid;place-items:center;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 3px var(--li-bold);font-family:var(--display);font-weight:800;font-size:clamp(30px,5.5vh,44px);color:var(--tim);padding-top:.1em}
.seq span.hole{box-shadow:inset 0 0 0 3px var(--do);color:var(--do);border:none;background:#FFF4F3}
.seq span.hole.done{box-shadow:inset 0 0 0 3px var(--la);color:var(--la);background:#fff}

/* ---------- Spelling ---------- */
.spbox{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;background:var(--card);border-radius:20px;padding:10px;box-shadow:inset 0 0 0 2px var(--li-bold)}
.sp-pic{font-size:clamp(50px,9vh,80px)}
.sp-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-row{display:flex;gap:7px;align-items:stretch}
.slot{min-width:54px;min-height:clamp(58px,9vh,74px);border-radius:14px;border:3px dashed var(--li-bold);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px 3px;background:#FAF9FF;transition:background .2s,border-color .2s}
.slot b{font-family:var(--letter);font-weight:700;font-size:clamp(28px,5vh,36px);line-height:1;color:var(--tim);min-height:36px;display:flex;align-items:center}
.slot.tn b{color:var(--do)}
.slot b i{font-style:normal;border-radius:6px;padding:0 1px;transition:background .2s}

/* ---------- Đồng bộ Supabase (tùy chọn) ----------

  cfg() { const c = window.BVL1_CONFIG || {}, l = LS.get('bvl1-cloud-cfg', {}); return { url: String(c.supabaseUrl || l.url || '').trim(), key: String(c.supabaseAnonKey || l.key || '').trim(), fixed: !!(c.supabaseUrl && c.supabaseAnonKey) }; },

      const vi = vs.filter(v => /^vi([-_]|$)/i.test(v.lang) || /vietnam|tiếng việt/i.test(v.name));
      this.voice = vi.find(v => /premium|enhanced|nâng cao/i.test(v.name)) || vi.find(v => /linh|google|\ban\b/i.test(v.name)) || vi[0] || null;

function wavURI(samples, rate) {

  const n = Math.ceil(total * rate), out = new Float32Array(n), L = Math.floor(def.len * rate);

function spRow(W, filled, ghost) {
  const vHTML = vparts(W.v).map((ch, k) => `<i data-p="v${k}">${ch}</i>`).join('');
  const slot = (key, cls, content, label) => { const has = filled[key] || ghost; return `<span class="slot ${cls} ${filled[key] ? 'on' : ''} ${ghost && !filled[key] ? 'ghost' : ''}" data-p="${key}"><b>${has ? content : ''}</b><small>${label}</small></span>`; };
  return `<div class="sp-row">${W.d ? slot('d', '', W.d, 'âm đầu') : ''}${slot('v', '', vHTML, 'vần')}${slot('t', 'tn', toneSVG(W.t), 'dấu thanh')}</div>`;
}
function spellSteps(W, withVan) {
  const st = [], base = W.d + W.v;
  const vp = vparts(W.v);
  if (withVan && vp.length > 1) { vp.forEach((ch, k) => st.push({ t: VS[ch] || ch, hl: ['v' + k] })); st.push({ t: W.v, hl: ['v'] }); }
  if (W.d) { st.push({ t: SPC[W.d], hl: ['d'] }); st.push({ t: W.v, hl: ['v'] }); st.push({ t: base, hl: ['d', 'v'], out: base }); }
  else if (withVan && vp.length > 1) st[st.length - 1].out = base;
  else st.push({ t: W.v, hl: ['v'], out: base });
  if (W.t !== 'ngang') { st.push({ t: TONES[W.t].n, hl: ['t'] }); st.push({ t: W.w, hl: ['d', 'v', 't'], out: W.w, fin: 1 }); }

}
function playSpell(rowHost, outEl, W, withVan, done) {
  const clr = () => rowHost.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  V.play(spellSteps(W, withVan).map(s => ({ t: s.t, gap: s.fin ? 450 : 300, on: () => {
    if (!rowHost.isConnected) return;
    clr(); s.hl.forEach(h => rowHost.querySelector(`[data-p="${h}"]`)?.classList.add('hl'));
    if (s.out) outEl.innerHTML = `<span class="${s.fin ? 'fin' : ''}">${s.out}</span>`;
  } })), () => { clr(); if (done) done(); });
}

function fly(el, kind) {
  const pill = kind === 'pow' ? '#powPill' : '#starPill', num = kind === 'pow' ? '#powPill' : '#starPill';

  const r = el.getBoundingClientRect(), p = $(pill).getBoundingClientRect();
  const s = document.createElement('div');
  s.className = 'fstar'; s.innerHTML = `<svg viewBox="0 0 24 24"><use href="#${kind === 'pow' ? 'bolt' : 'spark'}"/></svg>`;
  const x0 = r.left + r.width / 2 - 21, y0 = r.top + Math.min(r.height / 2, 80) - 21;
  s.style.left = x0 + 'px'; s.style.top = y0 + 'px';
  document.body.appendChild(s);
  requestAnimationFrame(() => requestAnimationFrame(() => { s.style.transform = `translate(${p.left - x0 - 8}px, ${p.top - y0 - 8}px) scale(.55)`; s.style.opacity = '.3'; }));

const fmtDur = s => s >= 3600 ? `${Math.floor(s / 3600)} giờ ${Math.round(s % 3600 / 60)} phút` : s >= 60 ? `${Math.round(s / 60)} phút` : `${s} giây`;
const THU = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
ROUTES.history = function (pid) {
  const P = PROFILES.list.find(p => p.id === (pid || (ME && ME.id)));
  if (!P) { go('who'); return; }
  setBar('Lịch sử học', true); backTo = ME ? ['map'] : ['who', { manage: true }];
  const H = HIST.all(P.id), I = HIST.itemsAll(P.id), st = Object.assign(DEF(), LS.get('bvl1-state-' + P.id, {}));
  const total = H.reduce((a, e) => a + (e.dur || 0), 0), days = new Set(H.map(e => new Date(e.t).toDateString())).size;
  const cats = { read: [0, 0], math: [0, 0], write: [0, 0] };
  Object.values(I).forEach(r => { if (cats[r.c]) { cats[r.c][0] += r.ok; cats[r.c][1] += r.miss; } });
  const weak = Object.values(I).filter(r => r.miss > 0).sort((a, b) => (b.miss / (b.ok + b.miss)) - (a.miss / (a.ok + a.miss)) || b.miss - a.miss).slice(0, 8);

  main.innerHTML = `<div class="hv">
    <div class="hhead"><span class="pav">${P.avatar}</span><div><h2>${esc(P.name)}</h2><p>${H.length ? `Lần học gần nhất: ${new Date(H[H.length - 1].t).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })}` : 'Chưa có buổi học nào.'}</p></div></div>

    <section><h3>Cần luyện thêm</h3>${weak.length ? `<div class="weak">${weak.map(r => `<span>${esc(r.l)} <small>sai ${r.miss}/${r.ok + r.miss}</small></span>`).join('')}</div>` : '<p class="note">Chưa có nội dung nào bé hay sai.</p>'}</section>

    ['Âm trong vần', uniq(ALLW.concat(VANLIST).flatMap(W => vparts(W.v).map(ch => VS[ch] || ch)))],
    ['Dấu thanh', ['huyền', 'sắc', 'hỏi', 'ngã', 'nặng']],
    ['Tiếng khi đánh vần', uniq(ALLW.concat(VANLIST).flatMap(W => [W.d + W.v, W.w]))],
    ['Sáu thanh', TONE_ROW],

  main.innerHTML = `<div class="hv"><p class="note" style="text-align:left">Nghe lần lượt từng âm. Giọng máy đọc theo phát âm Hà Nội nên chưa phân biệt r với d, s với x. Âm nào chưa chuẩn, cha mẹ hoặc cô giáo bấm micrô, đọc rõ âm đó (khoảng 1 giây) để thay. Bản thu chỉ lưu trên máy này và dùng cho mọi bé trên máy.</p>

  const bind = el => {

      } catch (e) { rb.classList.remove('on'); Rec.fail(e); }

  let armed = false, t;
  btn.onclick = () => {
    if (!armed) { armed = true; btn.classList.add('danger'); btn.textContent = ask; t = setTimeout(() => { armed = false; btn.classList.remove('danger'); btn.textContent = label; }, 3000); return; }
    clearTimeout(t); armed = false; action(); btn.classList.remove('danger'); btn.textContent = doneLabel;
  };
}

/* ---------- Phrase list (used to record the teacher voice) ---------- */
function collectPhrases() {
  const s = new Set(), add = t => { if (t) s.add(norm(t)); };
  LETTERS.forEach(L => { add(L.s); add(L.say); add(PH.findLetter(L)); if (L.st) add(PH.firstQ(L.w.split(' ')[0])); });
  NUMW.forEach(add); add(PH.traceIntro); add('cờ'); add('ca');
  for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) add(PH.add(a, b));
  for (let a = 2; a <= 10; a++) for (let b = 1; b <= a; b++) add(PH.sub(a, b));
  OBJ.forEach(([, n]) => add(PH.count(n)));
  SH.forEach(x => { add(PH.shape(x)); COL.forEach(c => add(PH.shapeColor(x, c))); }); COL.forEach(c => add(PH.color(c)));
  ALLW.forEach(W => { add(SPC[W.d]); add(W.v); vparts(W.v).forEach(ch => add(VS[ch] || ch)); add(W.d + W.v); add(W.w); add(W.say); add(PH.readWord(W.w)); add(PH.spellQ(W.w)); add(PH.toneQ(W.w)); });
  W23.forEach(W => add(PH.vanQ(W.w)));
  DIGRAPHS.forEach(D => { add(D.s); add(D.say); add(PH.findDig(D)); });
  RULEW.forEach(R => add(R.say)); SENT.forEach(X => add(X.s));
  for (let n = 0; n <= 10; n++) { if (n < 10) add(PH.after(n)); if (n > 0) add(PH.before(n)); }
  for (let a = 2; a <= 10; a++) for (let b = 1; b < a; b++) add(PH.bond(a, b));
  for (let a = 1; a <= 9; a++) { add(PH.add(a, 0)); add(PH.add(0, a)); add(PH.sub(a, 0)); add(PH.sub(a, a)); }
  add(PH.solid('khối lập phương')); add(PH.solid('khối hộp chữ nhật'));
  VANLIST.forEach(W => { if (W.d) { add(SPC[W.d]); add(W.d + W.v); } add(W.v); vparts(W.v).forEach(ch => add(VS[ch] || ch)); add(W.w); add(W.say); add(TONES[W.t].n); });
  TONE_ROW.forEach(add); Object.keys(TONES).forEach(t => add(toneSay(t))); TONE_EX.forEach(x => { add(x.w); add(x.say); });
  for (let n = 2; n <= 10; n++) for (let k = 1; k < n; k++) { add(PH.addEq(k, n - k)); add(PH.subEq(n, k)); }
  CMP_EX.forEach(([a, b]) => add(PH.cmpEq(a, b))); SHAPE_B.forEach(x => add(x.n)); for (let h = 1; h <= 12; h++) add(HOURW(h) + ' giờ');
  Object.values(TONES).forEach(t => add(t.n));
  ['upperQ', 'lowerQ', 'countHint', 'more', 'less', 'bigger', 'smaller', 'biggest', 'smallest', 'missing', 'spellTogether', 'nowYou', 'traceNone', 'traceOut', 'traceMore', 'traceMissing', 'levelClear', 'needPower', 'enoughPower', 'locked', 'zoneLocked', 'goOn', 'start', 'letGo', 'train', 'trainDone', 'flower', 'letHint', 'spellHint', 'hello', 'welcome', 'who', 'recIntro', 'recDone', 'story', 'victory', 'ruleQ', 'sentQ', 'signQ', 'picEq', 'longer', 'shorter', 'taller', 'lower', 'clock', 'digHint', 'numHint', 'bookHint', 'vanHint', 'toneHint', 'sentHint', 'calcHint', 'shapeHint', 'clockHint', 'cmpHint'].forEach(k => add(PH[k]));
  PH.praise.forEach(add); PH.wrong.forEach(add); PH.steps.forEach(add); PH.stars.forEach(add); Object.values(PH.trainSkill).forEach(add);
  ZONES.forEach(z => { add(z.intro); add(z.bossIntro); add(z.clear); });
  return [...s];
}
